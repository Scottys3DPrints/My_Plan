name: Build APK

# Aegis is not distributed through a store, so this workflow *is* the distribution
# channel. Every push to a build branch produces an installable APK as a downloadable
# artifact; every tag also publishes a Release, which is the link you open on the phone.

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      # The core module is pure Kotlin/JVM, so this runs in seconds and needs no Android
      # SDK. It is the fast signal: if the classifier, rules engine or cooling-off logic
      # is broken, fail here rather than after a five-minute APK build.
      - name: Test :core
        run: ./gradlew -c settings-core-only.gradle.kts :core:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v3

      # Signing is optional. With the four secrets set, the release APK is signed with
      # your own key, which is what allows later builds to install as an *update* over
      # this one. Without them the build still succeeds and is signed with the debug key
      # — installable, but it will not upgrade a differently-signed install.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AEGIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aegis.jks"
            echo "keystore=$RUNNER_TEMP/aegis.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key configured; falling back to the debug key." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Both variants are built. The release build is the one to install; the debug build
      # exists so that a problem confined to R8 shrinking still leaves something
      # installable rather than an empty artifact list.
      # The version code must climb monotonically or Android refuses the update as a
      # downgrade. The run number does that for free and never repeats.
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.1.0-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($GITHUB_RUN_NUMBER)"

      - name: Build APKs
        env:
          AEGIS_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
          AEGIS_KEY_ALIAS: ${{ secrets.AEGIS_KEY_ALIAS }}
          AEGIS_KEY_PASSWORD: ${{ secrets.AEGIS_KEY_PASSWORD }}
          AEGIS_VERSION_NAME: ${{ steps.version.outputs.name }}
          AEGIS_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Name the artifacts
        id: naming
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          CODE="${{ steps.version.outputs.code }}"
          mkdir -p dist

          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "No release APK produced." >&2
            exit 1
          fi
          # The trailing number is the version code. The in-app updater parses it from
          # this filename, so the format is load-bearing — do not change it casually.
          cp "$RELEASE_APK" "dist/aegis-${VERSION}-${CODE}.apk"
          echo "release=dist/aegis-${VERSION}-${CODE}.apk" >> "$GITHUB_OUTPUT"

          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "dist/aegis-${VERSION}-${CODE}-debug.apk"
          fi

          ls -lh dist

      # Prints the certificate the APK was signed with.
      #
      # This is not decoration. Android will only install an update over an app signed
      # with the *same* key, and a build with no signing secrets falls back to the debug
      # key — which each fresh CI runner generates at random. Two such builds therefore
      # cannot update each other, and this step is how you can see that for yourself:
      # compare the fingerprint across two runs. Once the signing secrets are set, it
      # should be identical every time, and identical to the key on your machine.
      - name: Report signing identity
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found; skipping." && exit 0
          fi
          echo "Signed with (release):"
          "$APKSIGNER" verify --print-certs "${{ steps.naming.outputs.release }}" \
            | grep -i "SHA-256 digest" || echo "  could not read certificate"
          if [ -n "${{ steps.signing.outputs.signed }}" ] && [ "${{ steps.signing.outputs.signed }}" = "false" ]; then
            echo ""
            echo "::warning::No signing key configured. This build uses a throwaway debug key that"
            echo "::warning::differs on every run, so it CANNOT install as an update over any other"
            echo "::warning::build. Set the AEGIS_KEYSTORE_* secrets to get updatable APKs."
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: dist/*.apk
          if-no-files-found: error

      # A tag turns the build into a Release, which gives a stable URL you can open in
      # the phone's browser and tap to install.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            Install directly on the phone — no store account, no developer tools.

            1. Open this page on the phone and tap the `.apk` below.
            2. Allow your browser to install unknown apps when prompted.
            3. Open Aegis and follow the two setup steps on the Home screen.

            See `docs/INSTALL.md` for the full walkthrough, including the extra step
            Android 13+ requires before a sideloaded app can use an accessibility service.
